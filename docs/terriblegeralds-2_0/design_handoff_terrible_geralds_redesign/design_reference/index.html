<body>
<div id="root"></div>

<script type="text/babel" src="shared/site-chrome.jsx"></script>

<script type="text/babel">
const { TornDivider } = window.TerribleGeraldSDesignSystem_d3d4e8;

function App() {
  React.useEffect(() => {
    const io = new IntersectionObserver((es) => es.forEach((e) => {
      if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); }
    }), { threshold: .12 });
    document.querySelectorAll('.reveal').forEach((el) => io.observe(el));
    return () => io.disconnect();
  }, []);

  return (
    <div>
      <window.SiteHeader active="" nextBarProps={{}} />
      <div id="top"><window.Hero /></div>
      <div className="reveal"><window.ScheduleSection /></div>
      <TornDivider color="var(--cream)" />
      <div className="reveal"><window.PizzaSection /></div>
      <window.ReviewsSection />
      <div className="reveal"><window.CateringSection /></div>
      <TornDivider color="var(--ink)" />
      <window.TestimonialsSection />
      <div className="reveal"><window.AboutSection /></div>
      <div className="reveal"><window.VenuesSection /></div>
      <TornDivider color="var(--ink)" />
      <window.WallSection />
      <div className="reveal"><window.NewsletterSection /></div>
      <window.SiteFooter />
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
