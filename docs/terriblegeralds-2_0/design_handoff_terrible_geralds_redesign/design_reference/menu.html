<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Menu — Terrible Gerald's Pizza</title>
<link rel="stylesheet" href="_ds/terrible-gerald-s-design-system-d3d4e850-0bd9-407b-98a4-82938c1b34c6/tokens/colors.css">
<link rel="stylesheet" href="_ds/terrible-gerald-s-design-system-d3d4e850-0bd9-407b-98a4-82938c1b34c6/tokens/typography.css">
<link rel="stylesheet" href="_ds/terrible-gerald-s-design-system-d3d4e850-0bd9-407b-98a4-82938c1b34c6/tokens/spacing.css">
<link rel="stylesheet" href="_ds/terrible-gerald-s-design-system-d3d4e850-0bd9-407b-98a4-82938c1b34c6/tokens/motion.css">
<link rel="stylesheet" href="_ds/terrible-gerald-s-design-system-d3d4e850-0bd9-407b-98a4-82938c1b34c6/styles.css">
<link rel="stylesheet" href="shared/site.css">
<script src="_ds/terrible-gerald-s-design-system-d3d4e850-0bd9-407b-98a4-82938c1b34c6/_ds_bundle.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
.menu-cat{margin-bottom:56px}
.menu-cat:last-child{margin-bottom:0}
.list-rows{max-width:820px}
.list-row{display:flex;justify-content:space-between;gap:18px;align-items:baseline;padding:14px 0;border-bottom:1px dashed var(--paper-line)}
.list-row:last-child{border-bottom:none}
.list-row .nm{font-weight:800;font-size:1.05rem}
.list-row .ds{display:block;font-size:.85rem;color:var(--ink-soft);font-weight:500;margin-top:2px}
.list-row .pr{font-family:var(--font-display);font-size:1.05rem;color:var(--red);white-space:nowrap}
.tag{display:inline-block;font-size:.68rem;font-weight:800;text-transform:uppercase;letter-spacing:.04em;background:var(--teal);color:var(--cream);padding:2px 8px;border-radius:20px;margin-left:8px;vertical-align:middle;transform:translateY(-1px)}
.tag.gf{background:var(--gold);color:var(--ink)}
.allergen-box{background:var(--bone-2);border:2px solid var(--ink);border-radius:8px;padding:22px 26px;max-width:820px;margin-top:10px}
.allergen-box p{margin:0;font-size:.88rem;color:var(--ink-soft)}
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="shared/site-chrome.jsx"></script>
<script type="text/babel">
const { PizzaCard, SectionHeader, Button } = window.TerribleGeraldSDesignSystem_d3d4e8;

const PIZZAS = [
  { name: 'The Gerald', ingredients: 'Red sauce, mozz, pepperoni, hot honey, parm, basil' },
  { name: 'The Hoppen', ingredients: 'Garlic oil, mozz, sausage, hot honey, ricotta, arugula' },
  { name: 'The Meat Sweats', ingredients: 'Red sauce, mozz, pepperoni, sausage, bacon, hot honey' },
  { name: 'The Veg Out', ingredients: 'Garlic oil, mozz, mushroom, red onion, spinach, ricotta' },
  { name: 'The Mistake', ingredients: 'Calabrian chili, mozz, soppressata, hot honey, pickled fresno' },
  { name: "Gerald's Regret", ingredients: 'White sauce, mozz, roasted garlic, caramelized onion, thyme' },
  { name: 'The Bad Decision', ingredients: 'Red sauce, mozz, jalapeño, pineapple, bacon — yes, really' },
  { name: 'Terrible Margherita', ingredients: 'San Marzano, fresh mozz, basil, olive oil — the "safe" one' },
];

const STARTERS = [
  { nm: 'Garlic Knots', ds: 'Wood-fired dough knots, garlic butter, parm, side of marinara', pr: '$9' },
  { nm: 'Blistered Shishitos', ds: 'Charred shishito peppers, flaky salt, lemon', pr: '$8', tag: 'VG' },
  { nm: 'Meatball Trio', ds: 'Three wood-fired meatballs, red sauce, ricotta, basil', pr: '$11' },
];
const SALADS = [
  { nm: 'The Lesser Evil', ds: 'Arugula, shaved parm, lemon vinaigrette, pickled onion', pr: '$9', tag: 'VG' },
  { nm: 'Terrible Caesar', ds: 'Romaine, garlic croutons, parm, white anchovy (optional)', pr: '$10' },
];
const DRINKS = [
  { nm: "Whatever's On Tap", ds: 'We don\u2019t carry booze \u2014 check the host brewery\u2019s board. We just make it taste better.', pr: '' },
  { nm: 'Canned Soda & Sparkling Water', ds: 'Cold, fizzy, unremarkable in the best way', pr: '$3' },
  { nm: "Kid's Lemonade", ds: 'For the tiny humans who came along', pr: '$3' },
];

function ListRows({ items }) {
  return (
    <div className="list-rows">
      {items.map((it, i) => (
        <div className="list-row" key={i}>
          <div>
            <span className="nm">{it.nm}{it.tag && <span className={"tag" + (it.tag === 'GF' ? ' gf' : '')}>{it.tag}</span>}</span>
            <small className="ds">{it.ds}</small>
          </div>
          {it.pr && <span className="pr">{it.pr}</span>}
        </div>
      ))}
    </div>
  );
}

function App() {
  return (
    <div>
      <window.SiteHeader active="menu.html" showNextBar={false} />
      <div className="pg-hero">
        <div className="wrap">
          <span className="kicker">terrible names. you'll order anyway.</span>
          <h1>The Full Menu</h1>
          <p>Eight pizzas, a few things to eat while you wait, and a promise that we will never, ever call anything "artisanal."</p>
        </div>
      </div>

      <section className="pg bg-cream" style={{ background: 'var(--cream)' }}>
        <div className="wrap">
          <div className="menu-cat">
            <SectionHeader kicker="wood-fired · 12in · serves 1-2" title="Pizzas" />
            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4,1fr)', gap: 18 }} className="gerald-pizza-grid">
              {PIZZAS.map((p, i) => <PizzaCard key={i} {...p} />)}
            </div>
            <p style={{ marginTop: 16, fontSize: '.85rem', color: 'var(--ink-soft)' }}>Gluten-free crust available on any pie, <span className="tag gf">+$3</span> — limited daily, ask at the window.</p>
          </div>

          <div className="menu-cat">
            <SectionHeader kicker="while the oven works" title="Starters" />
            <ListRows items={STARTERS} />
          </div>

          <div className="menu-cat">
            <SectionHeader kicker="green, allegedly" title="Salads" />
            <ListRows items={SALADS} />
          </div>

          <div className="menu-cat">
            <SectionHeader kicker="to wash it down" title="Drinks" />
            <ListRows items={DRINKS} />
          </div>

          <div className="allergen-box">
            <p><strong>Dietary &amp; allergen notes:</strong> VG = vegetarian. Everything is made in a small wood-fired trailer that also handles gluten, dairy, and nuts — we take real care, but we can't promise a sterile kitchen. Ask Gerald (or whoever's in the window) if you've got a serious allergy, and we'll level with you.</p>
          </div>

          <div style={{ marginTop: 46, textAlign: 'center' }}>
            <Button variant="red" href="schedule.html">Find Us This Week →</Button>
          </div>
        </div>
      </section>

      <window.SiteFooter />
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
